career-profile:
  title: Profile
  summary: |
    AI Engineer and LLM researcher working across the full model and service lifecycle: collecting and refining data, pretraining, post-training, evaluation, and production delivery. At Hanwha Systems, I build domain-specific AI agents and data pipelines for enterprise decision support. Previously, at SNU Thunder Lab, I contributed to Korean-English LLM development, long-context modeling, Korean evaluation benchmarks, and privacy-preserving NLP. I enjoy turning questions about what “should” work into measurable improvements in real systems.

experiences:
  title: Experience
  info:
    - role: AI Engineer · AI Agent & Data Pipeline
      time: Jan 2026 – Present
      company: Hanwha Systems ICT · Seoul, Korea
      details: |
        Building production AI transformation systems for a solar energy company and a shipbuilding company. Designed Databricks-based pipelines for API/RPA collection, deduplication, LLM filtering, and database loading; developed RAG + CoT report agents and newsletter delivery jobs; and built canonical-block parsers for PDF, PPTX, XLS, and XLSX documents. Also designing ontology and knowledge-layer components that help agents reason over shipyard process-risk and digital-twin data.

    - role: AI/ML Researcher · CHAMP Project
      time: Sep 2024 – Dec 2025
      company: SNU Thunder Lab · Seoul, Korea
      details: |
        Contributed to the Korean-English Thunder LLM pipeline, from 3TB-scale web data collection and refinement to tokenizer design, SFT, DPO, and distributed inference. Built Korean instruction data, optimized inference with double buffering and two-stage batching, and improved GPU efficiency by 30% in project benchmarks. Research contributions included TRONTOR, Korean evaluation benchmarks, pretraining-data filtering, and court-judgment de-identification.

    - role: Developer Training Program
      time: Mar 2022 – Sep 2022
      company: En-CORE Academy
      details: |
        Completed a 960-hour program covering Python, machine learning, big-data processing, IoT, and autonomous-driving algorithms.

