research:
  title: Research highlights
  items:
    - title: "TRONTOR: To RoPE or Not to RoPE for Long-Context Modeling"
      meta: First author · EMNLP 2026 submission
      details: A lightweight head-wise router dynamically selects RoPE or NoPE to reduce attention decay in long contexts, improving RULER performance while accelerating inference by more than 10%.
    - title: Llama-Thunder-LLM
      meta: SNU Thunder Lab · CHAMP
      details: Korean-English foundation-model development spanning 3TB web-data refinement, Thunder-Tok tokenizer design, Korean SFT data generation, DPO, and distributed inference optimization.
    - title: SNU Thunder-DeID
      meta: Research & project
      details: Built annotation guidelines, training data, and NER-based detection and type classification for automatic privacy de-identification of Korean court judgments.

